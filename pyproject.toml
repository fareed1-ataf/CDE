[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cde_shared_lib"
version = "1.0.0"
description = "Cyber Data Engine — Shared Library for cybersecurity dataset generation, validation, and threat scoring"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Cyber Data Engine", email="admin@cyberdataengine.local" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
]
